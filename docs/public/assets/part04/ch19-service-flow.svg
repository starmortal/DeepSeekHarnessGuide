<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" font-family="'Noto Serif SC','Source Han Serif SC','Microsoft YaHei',serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4D6BFE"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="908" height="388" rx="12" fill="#FDFBF7" stroke="#A9B7F0" stroke-width="2"/>

  <text x="460" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A1A1A">服务形态：一个插件开窗口，别的插件来办事（示意）</text>
  <text x="460" y="48" text-anchor="middle" font-size="11" fill="#4A4A4A">提供方把服务挂到 ctx 上，消费方声明依赖后直接调用</text>

  <!-- 提供方 -->
  <rect x="30" y="70" width="270" height="150" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="50" y="94" font-size="13" font-weight="bold" fill="#4D6BFE">提供方插件（类形态）</text>
  <rect x="50" y="104" width="230" height="26" rx="3" fill="#FDFBF7" stroke="#4D6BFE"/>
  <text x="165" y="121" text-anchor="middle" font-size="11" fill="#1A1A1A">MetricsService extends Service</text>
  <text x="50" y="152" font-size="11" fill="#1A1A1A">super(ctx, 'metrics')</text>
  <text x="50" y="172" font-size="11" fill="#1A1A1A">把 metrics 挂到 ctx 上</text>
  <text x="50" y="196" font-size="11" fill="#1A1A1A">record(event, value) 对外方法</text>

  <!-- 中间服务 -->
  <rect x="370" y="105" width="180" height="80" rx="4" fill="#FFEE58" stroke="#1A1A1A"/>
  <text x="460" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A1A1A">ctx.metrics</text>
  <text x="460" y="157" text-anchor="middle" font-size="10" fill="#1A1A1A">挂在 ctx 上的服务</text>
  <text x="460" y="173" text-anchor="middle" font-size="10" fill="#4A4A4A">tools / llm / agents 同理</text>

  <!-- 消费方 -->
  <rect x="620" y="70" width="270" height="150" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="640" y="94" font-size="13" font-weight="bold" fill="#4D6BFE">消费方插件</text>
  <rect x="640" y="104" width="230" height="26" rx="3" fill="#FDFBF7" stroke="#4D6BFE"/>
  <text x="755" y="121" text-anchor="middle" font-size="11" fill="#1A1A1A">inject: ['metrics']</text>
  <text x="640" y="152" font-size="11" fill="#1A1A1A">框架保证 apply 执行时</text>
  <text x="640" y="172" font-size="11" fill="#1A1A1A">服务一定已就绪</text>
  <text x="640" y="196" font-size="11" fill="#1A1A1A">ctx.metrics.record(...) 调用</text>

  <!-- 箭头：提供方 -> ctx -->
  <line x1="300" y1="130" x2="368" y2="140" stroke="#4D6BFE" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="316" y="124" font-size="10" fill="#4D6BFE">注册</text>
  <!-- 箭头：ctx -> 消费方 -->
  <line x1="552" y1="140" x2="618" y2="130" stroke="#4D6BFE" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="566" y="124" font-size="10" fill="#4D6BFE">调用</text>

  <!-- 底部对比 -->
  <rect x="30" y="250" width="860" height="120" rx="4" fill="#FFFFFF" stroke="#1A1A1A"/>
  <text x="50" y="274" font-size="12" font-weight="bold" fill="#4D6BFE">三种形态怎么选</text>
  <text x="50" y="300" font-size="11" fill="#1A1A1A">函数形态 = 自己去办一件事：只给 Agent 加能力，默认就够</text>
  <text x="50" y="324" font-size="11" fill="#1A1A1A">对象形态 = 名字和流程打包：功能约等于函数，多了静态声明</text>
  <text x="50" y="348" font-size="11" fill="#1A1A1A">类形态 = 开一个公共窗口：要让别的插件调用你的能力时才用</text>
</svg>
