<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" font-family="'Noto Serif SC','Source Han Serif SC','Microsoft YaHei',serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="908" height="488" rx="12" fill="#FDFBF7" stroke="#A9B7F0" stroke-width="2"/>
  <text x="460" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A1A1A">Skill 的流转：从哪来 → 注册表 → 怎么被看见（示意）</text>
  <text x="460" y="50" text-anchor="middle" font-size="11" fill="#4A4A4A">货架决定"有哪些"，注册表决定"同名谁赢"，消费方决定"模型和用户怎么看见"</text>

  <!-- 来源层：三张卡，中文优先级标注 -->
  <rect x="60" y="72" width="240" height="78" rx="6" fill="#FFFFFF" stroke="#4D6BFE" stroke-width="2"/>
  <rect x="60" y="72" width="240" height="26" rx="6" fill="#FFEE58"/>
  <text x="180" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">项目货架（最优先）</text>
  <text x="180" y="116" text-anchor="middle" font-size="10" fill="#1A1A1A">&lt;项目根&gt;/.dsh/skills</text>
  <text x="180" y="134" text-anchor="middle" font-size="9" fill="#4A4A4A">跟着项目走、随仓库分发</text>

  <rect x="340" y="72" width="240" height="78" rx="6" fill="#FFFFFF" stroke="#4D6BFE" stroke-width="2"/>
  <rect x="340" y="72" width="240" height="26" rx="6" fill="#FFEE58"/>
  <text x="460" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">用户货架（次之）</text>
  <text x="460" y="116" text-anchor="middle" font-size="10" fill="#1A1A1A">~/.dsh/skills</text>
  <text x="460" y="134" text-anchor="middle" font-size="9" fill="#4A4A4A">所有工作区都能用</text>

  <rect x="620" y="72" width="240" height="78" rx="6" fill="#FFFFFF" stroke="#4D6BFE" stroke-width="2"/>
  <rect x="620" y="72" width="240" height="26" rx="6" fill="#FFEE58"/>
  <text x="740" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">其他来源</text>
  <text x="740" y="116" text-anchor="middle" font-size="10" fill="#1A1A1A">插件随包 / 社区市场</text>
  <text x="740" y="134" text-anchor="middle" font-size="9" fill="#4A4A4A">装进来的 SKILL.md</text>

  <!-- 到注册表 -->
  <line x1="180" y1="150" x2="180" y2="206" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="150" x2="460" y2="206" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="150" x2="740" y2="206" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 注册表 -->
  <rect x="170" y="210" width="580" height="76" rx="6" fill="#FFFFFF" stroke="#4D6BFE" stroke-width="2"/>
  <rect x="170" y="210" width="580" height="26" rx="6" fill="#FFEE58"/>
  <text x="460" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">skill 注册表（dsh-skill）</text>
  <text x="460" y="252" text-anchor="middle" font-size="10" fill="#1A1A1A">合并各货架目录；同名时，优先级高的货架赢</text>
  <text x="460" y="272" text-anchor="middle" font-size="9" fill="#4A4A4A">文件系统提供方（dsh-skill-filesystem）负责发现与监视</text>

  <line x1="460" y1="286" x2="460" y2="322" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 消费方 -->
  <rect x="200" y="326" width="520" height="64" rx="6" fill="#FFFFFF" stroke="#4D6BFE" stroke-width="2"/>
  <rect x="200" y="326" width="520" height="26" rx="6" fill="#FFEE58"/>
  <text x="460" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">dsh-tool-skill（消费方）</text>
  <text x="460" y="368" text-anchor="middle" font-size="9" fill="#4A4A4A">首请求前注入会话目录（名字+描述）· 提供 skill 加载工具 · 监听 /名字 手势</text>

  <!-- 分叉到模型/用户 -->
  <line x1="310" y1="390" x2="270" y2="420" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="390" x2="650" y2="420" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="424" width="360" height="48" rx="6" fill="#FFFFFF" stroke="#E6A817" stroke-width="2"/>
  <text x="260" y="444" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A1A1A">模型</text>
  <text x="260" y="462" text-anchor="middle" font-size="9" fill="#4A4A4A">看目录 → 调 skill 工具加载完整指令</text>

  <rect x="480" y="424" width="360" height="48" rx="6" fill="#FFFFFF" stroke="#E6A817" stroke-width="2"/>
  <text x="660" y="444" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A1A1A">用户</text>
  <text x="660" y="462" text-anchor="middle" font-size="9" fill="#4A4A4A">输入 /名字 直接注入指令到本轮</text>
</svg>
