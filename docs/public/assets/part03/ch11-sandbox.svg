<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="'Noto Serif SC','Source Han Serif SC','Microsoft YaHei',serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="908" height="458" rx="12" fill="#FDFBF7" stroke="#A9B7F0" stroke-width="2"/>
  <text x="460" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A1A1A">沙箱：策略说边界，后端来执行（示意）</text>
  <text x="460" y="50" text-anchor="middle" font-size="11" fill="#4A4A4A">只管文件系统效果；策略与后端分开，命令被包装成受限进程再跑</text>

  <!-- 顶部：一次命令调用 -->
  <rect x="250" y="72" width="420" height="46" rx="6" fill="#FFFFFF" stroke="#4D6BFE" stroke-width="2"/>
  <text x="460" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A1A1A">一次命令调用（bash / pwsh / 写文件）</text>
  <text x="460" y="108" text-anchor="middle" font-size="9" fill="#4A4A4A">工具执行到 execute 这一步，先过沙箱</text>

  <line x1="460" y1="118" x2="460" y2="150" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 策略解析 -->
  <rect x="250" y="154" width="420" height="70" rx="6" fill="#FFFFFF" stroke="#4D6BFE" stroke-width="2"/>
  <text x="460" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A1A1A">策略解析（每次调用都重新算）</text>
  <text x="460" y="194" text-anchor="middle" font-size="10" fill="#4A4A4A">SandboxPolicy = 模式 + 工作区根目录</text>
  <text x="460" y="210" text-anchor="middle" font-size="9" fill="#6B7280">read-only / workspace-write 会套壳；danger-full-access 直接裸跑</text>

  <line x1="460" y1="224" x2="460" y2="256" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 后端三平台 -->
  <text x="460" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A1A1A">平台后端：把命令包成受限进程</text>
  <rect x="70" y="290" width="240" height="56" rx="6" fill="#FFFFFF" stroke="#4D6BFE" stroke-width="2"/>
  <text x="190" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">Linux</text>
  <text x="190" y="330" text-anchor="middle" font-size="9" fill="#4A4A4A">bwrap / Landlock（内核无特权隔离）</text>
  <rect x="340" y="290" width="240" height="56" rx="6" fill="#FFFFFF" stroke="#4D6BFE" stroke-width="2"/>
  <text x="460" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">macOS</text>
  <text x="460" y="330" text-anchor="middle" font-size="9" fill="#4A4A4A">Seatbelt（TrustedBSD MAC 沙箱）</text>
  <rect x="610" y="290" width="240" height="56" rx="6" fill="#FFFFFF" stroke="#4D6BFE" stroke-width="2"/>
  <text x="730" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">Windows</text>
  <text x="730" y="330" text-anchor="middle" font-size="9" fill="#4A4A4A">ACL 受限令牌运行器</text>

  <line x1="460" y1="346" x2="460" y2="372" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 受限进程 -->
  <rect x="250" y="376" width="420" height="42" rx="6" fill="#FFFDF5" stroke="#E6A817" stroke-width="2"/>
  <text x="460" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A1A1A">受限进程：只能在边界内动文件</text>

  <!-- fail-closed -->
  <rect x="40" y="376" width="170" height="70" rx="6" fill="#FFFFFF" stroke="#E6A817" stroke-width="2"/>
  <text x="125" y="398" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">fail-closed</text>
  <text x="125" y="416" text-anchor="middle" font-size="9" fill="#4A4A4A">没有可用后端？</text>
  <text x="125" y="432" text-anchor="middle" font-size="9" fill="#4A4A4A">报 SANDBOX_UNAVAILABLE，</text>
  <text x="125" y="444" text-anchor="middle" font-size="9" fill="#4A4A4A">绝不静默裸跑</text>
</svg>
