<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" font-family="'Noto Serif SC','Source Han Serif SC','Microsoft YaHei',serif">
  <rect x="6" y="6" width="908" height="288" rx="12" fill="#FDFBF7" stroke="#A9B7F0" stroke-width="2"/>

  <text x="460" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A1A1A">DeepSeek 推理档位（示意）</text>
  <text x="460" y="56" text-anchor="middle" font-size="11" fill="#6B7280">档位决定模型"思考"花多大力气：越往右想得越深、越慢、越贵</text>

  <!-- off -->
  <rect x="52" y="96" width="190" height="110" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="147" y="132" text-anchor="middle" font-size="17" font-weight="bold" font-family="Consolas,monospace" fill="#1A1A1A">off</text>
  <text x="147" y="158" text-anchor="middle" font-size="11" fill="#4A4A4A">关闭思考（thinking disabled）</text>
  <text x="147" y="178" text-anchor="middle" font-size="11" fill="#4A4A4A">最快、最省</text>

  <!-- low -->
  <rect x="262" y="96" width="190" height="110" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="357" y="132" text-anchor="middle" font-size="17" font-weight="bold" font-family="Consolas,monospace" fill="#1A1A1A">low</text>
  <text x="357" y="158" text-anchor="middle" font-size="11" fill="#4A4A4A">轻量思考</text>
  <text x="357" y="178" text-anchor="middle" font-size="11" fill="#4A4A4A">简单问答够用</text>

  <!-- high 默认 -->
  <rect x="472" y="96" width="190" height="110" rx="4" fill="#FFEE58" stroke="#1A1A1A" stroke-width="2"/>
  <text x="567" y="132" text-anchor="middle" font-size="17" font-weight="bold" font-family="Consolas,monospace" fill="#1A1A1A">high</text>
  <text x="567" y="158" text-anchor="middle" font-size="11" fill="#1A1A1A">深度推理，Agent 任务合适</text>
  <text x="567" y="178" text-anchor="middle" font-size="11" fill="#1A1A1A">默认档 · 慢一点、贵一点</text>

  <!-- max -->
  <rect x="682" y="96" width="190" height="110" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="777" y="132" text-anchor="middle" font-size="17" font-weight="bold" font-family="Consolas,monospace" fill="#1A1A1A">max</text>
  <text x="777" y="158" text-anchor="middle" font-size="11" fill="#4A4A4A">最高思考强度</text>
  <text x="777" y="178" text-anchor="middle" font-size="11" fill="#4A4A4A">最难的活才用</text>

  <!-- 箭头 -->
  <line x1="252" y1="151" x2="262" y2="151" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="260,145 272,151 260,157" fill="#1A1A1A"/>
  <line x1="462" y1="151" x2="472" y2="151" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="470,145 482,151 470,157" fill="#1A1A1A"/>
  <line x1="672" y1="151" x2="682" y2="151" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="680,145 692,151 680,157" fill="#1A1A1A"/>

  <text x="460" y="256" text-anchor="middle" font-size="10" fill="#6B7280">（示意）</text>
</svg>
