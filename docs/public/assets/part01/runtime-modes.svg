<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" font-family="'Noto Serif SC','Source Han Serif SC','Microsoft YaHei',serif">
  <rect x="6" y="6" width="908" height="348" rx="12" fill="#FDFBF7" stroke="#A9B7F0" stroke-width="2"/>

  <!-- 标题 -->
  <text x="460" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A1A1A">四种运行模式 = 四套插件组合预设（示意）</text>

  <!-- 标准模式（荧光） -->
  <rect x="62"  y="150" width="176" height="96" rx="4" fill="#FFEE58" stroke="#1A1A1A"/>
  <text x="150" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A1A1A">标准 Standard</text>
  <text x="150" y="204" text-anchor="middle" font-size="11" fill="#1A1A1A">完整工具集 · 开箱即用</text>
  <text x="150" y="224" text-anchor="middle" font-size="11" fill="#1A1A1A">新手首选</text>

  <!-- 代码模式 -->
  <rect x="282" y="150" width="176" height="96" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="370" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A1A1A">代码 Code</text>
  <text x="370" y="204" text-anchor="middle" font-size="11" fill="#4A4A4A">模型写 TS 编排工具</text>
  <text x="370" y="224" text-anchor="middle" font-size="11" fill="#4A4A4A">省往返 · 省 Token</text>

  <!-- 极简模式 -->
  <rect x="502" y="150" width="176" height="96" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="590" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A1A1A">极简 Minimal</text>
  <text x="590" y="204" text-anchor="middle" font-size="11" fill="#4A4A4A">仅 bash + 文件编辑器</text>
  <text x="590" y="224" text-anchor="middle" font-size="11" fill="#4A4A4A">跑"裸 Agent"基准</text>

  <!-- 创造模式 -->
  <rect x="722" y="150" width="176" height="96" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="810" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A1A1A">创造 Creator</text>
  <text x="810" y="204" text-anchor="middle" font-size="11" fill="#4A4A4A">标准能力 + 运行时检查</text>
  <text x="810" y="224" text-anchor="middle" font-size="11" fill="#4A4A4A">造插件 / 造新模式</text>

  <!-- 底部注 -->
  <rect x="160" y="278" width="600" height="32" rx="3" fill="#FFEE58"/>
  <text x="460" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A1A1A">不是四种引擎，是四套预设 · 都可以自定义</text>
  <text x="460" y="336" text-anchor="middle" font-size="10" fill="#6B7280">（示意）</text>
</svg>
