<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" font-family="'Noto Serif SC','Source Han Serif SC','Microsoft YaHei',serif">
  <rect x="6" y="6" width="908" height="328" rx="12" fill="#FDFBF7" stroke="#A9B7F0" stroke-width="2"/>

  <!-- 标题 -->
  <text x="460" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A1A1A">权限三档 = 文件沙箱（示意）</text>

  <!-- 第一档：read-only -->
  <rect x="50" y="80" width="250" height="178" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="175" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A1A1A">只读</text>
  <text x="175" y="138" text-anchor="middle" font-size="10" fill="#6B7280">read-only</text>
  <text x="175" y="170" text-anchor="middle" font-size="11" fill="#1A1A1A">只能读，一个字都改不了</text>
  <text x="175" y="192" text-anchor="middle" font-size="11" fill="#4A4A4A">读文件、分析、出方案</text>
  <text x="175" y="224" text-anchor="middle" font-size="11" fill="#6B7280">代码审查 · 纯问答</text>

  <!-- 第二档：workspace-write（默认，荧光） -->
  <rect x="330" y="80" width="250" height="178" rx="4" fill="#FFEE58" stroke="#1A1A1A"/>
  <text x="455" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A1A1A">工作区写 · 默认</text>
  <text x="455" y="138" text-anchor="middle" font-size="10" fill="#4A4A4A">workspace-write</text>
  <text x="455" y="170" text-anchor="middle" font-size="11" fill="#1A1A1A">工作区 + 临时区可写</text>
  <text x="455" y="192" text-anchor="middle" font-size="11" fill="#1A1A1A">工作区外动一下先弹窗问你</text>
  <text x="455" y="224" text-anchor="middle" font-size="11" fill="#4A4A4A">日常干活</text>

  <!-- 第三档：danger-full-access -->
  <rect x="610" y="80" width="250" height="178" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="735" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A1A1A">完全访问</text>
  <text x="735" y="138" text-anchor="middle" font-size="10" fill="#6B7280">danger-full-access</text>
  <text x="735" y="170" text-anchor="middle" font-size="11" fill="#1A1A1A">全盘读写，无边界</text>
  <text x="735" y="192" text-anchor="middle" font-size="11" fill="#4A4A4A">系统维护等全局操作</text>
  <text x="735" y="224" text-anchor="middle" font-size="11" fill="#6B7280">切换前会二次确认</text>

  <!-- 底部注 -->
  <rect x="180" y="280" width="560" height="30" rx="3" fill="#FFEE58"/>
  <text x="460" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A1A1A">写入边界一次比一次大 · 默认 workspace-write</text>
  <text x="460" y="326" text-anchor="middle" font-size="10" fill="#6B7280">（示意）</text>
</svg>
