<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" font-family="'Noto Serif SC','Source Han Serif SC','Microsoft YaHei',serif">
  <rect x="6" y="6" width="908" height="348" rx="12" fill="#FDFBF7" stroke="#A9B7F0" stroke-width="2"/>

  <text x="460" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A1A1A">dsh 排障地图（示意）</text>

  <!-- 三大类标题 -->
  <text x="172" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#4D6BFE">启动问题</text>
  <text x="460" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#4D6BFE">配置问题</text>
  <text x="748" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#4D6BFE">运行问题</text>

  <!-- 启动问题列 -->
  <rect x="40" y="88" width="264" height="52" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="172" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">端口被占用</text>
  <text x="172" y="128" text-anchor="middle" font-size="10" fill="#4A4A4A">启动时换端口 dsh web --port 8080</text>

  <rect x="40" y="148" width="264" height="52" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="172" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">浏览器没自动打开</text>
  <text x="172" y="188" text-anchor="middle" font-size="10" fill="#4A4A4A">手动访问 http://127.0.0.1:3080</text>

  <rect x="40" y="208" width="264" height="52" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="172" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">服务自己退了</text>
  <text x="172" y="248" text-anchor="middle" font-size="10" fill="#4A4A4A">dsh 服务有时候会自退，用时重跑即可</text>

  <!-- 配置问题列 -->
  <rect x="328" y="88" width="264" height="52" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="460" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">MISSING_CREDENTIAL</text>
  <text x="460" y="128" text-anchor="middle" font-size="10" fill="#4A4A4A">没配密钥，去模型页存 Key</text>

  <rect x="328" y="148" width="264" height="52" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="460" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">UNKNOWN_MODEL / 401</text>
  <text x="460" y="188" text-anchor="middle" font-size="10" fill="#4A4A4A">模型没配置 / 密钥不对</text>

  <rect x="328" y="208" width="264" height="52" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="460" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">UNSUPPORTED_REASONING_EFFORT</text>
  <text x="460" y="248" text-anchor="middle" font-size="10" fill="#4A4A4A">档位不支持，用 off/low/high/max</text>

  <!-- 运行问题列 -->
  <rect x="616" y="88" width="264" height="52" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="748" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">429 限流 / 402 余额不足</text>
  <text x="748" y="128" text-anchor="middle" font-size="10" fill="#4A4A4A">降速重试 / 去开放平台充值</text>

  <rect x="616" y="148" width="264" height="52" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="748" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">500 / 502 / 503</text>
  <text x="748" y="188" text-anchor="middle" font-size="10" fill="#4A4A4A">服务端繁忙，稍等重试</text>

  <rect x="616" y="208" width="264" height="52" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="748" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">输入框锁住 / 输不进</text>
  <text x="748" y="248" text-anchor="middle" font-size="10" fill="#4A4A4A">默认模型指向已删提供方，重选模型</text>

  <!-- 底部三板斧 -->
  <rect x="40" y="286" width="840" height="52" rx="4" fill="#FFEE58" stroke="#1A1A1A"/>
  <text x="460" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A1A1A">先试的三板斧：看启动日志 → 让 AI 跑 --dump-config 查配置树 → 重启服务</text>
  <text x="460" y="328" text-anchor="middle" font-size="10" fill="#1A1A1A">还不行，去官方仓库 GitHub Issues 搜同样的报错</text>

  <text x="460" y="350" text-anchor="middle" font-size="9" fill="#6B7280">（示意）</text>
</svg>
