<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="'Noto Serif SC','Source Han Serif SC','Microsoft YaHei',serif">
  <rect x="6" y="6" width="908" height="548" rx="12" fill="#FDFBF7" stroke="#A9B7F0" stroke-width="2"/>

  <!-- 标题 -->
  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A1A1A">dsh 的插件树：一切皆插件（示意）</text>

  <!-- 顶部概念条：Agent = Model + Harness -->
  <rect x="280" y="46" width="360" height="42" rx="4" fill="#FFFFFF" stroke="#4D6BFE" stroke-width="1.5"/>
  <text x="460" y="73" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A1A1A">Agent = Model + Harness</text>
  <text x="460" y="108" text-anchor="middle" font-size="13" fill="#4A4A4A">模型负责聪明 · Harness 负责干活</text>

  <!-- 概念 → 插件树 箭头 -->
  <line x1="460" y1="118" x2="460" y2="144" stroke="#4A4A4A" stroke-width="1.5"/>
  <polygon points="460,149 453,139 467,139" fill="#4A4A4A"/>

  <!-- 上层插件（4 个） -->
  <rect x="86"  y="152" width="128" height="56" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="150" y="179" text-anchor="middle" font-size="13" fill="#1A1A1A">模型适配器</text>
  <text x="150" y="197" text-anchor="middle" font-size="10" fill="#6B7280">可替换</text>

  <rect x="306" y="152" width="128" height="56" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="370" y="179" text-anchor="middle" font-size="13" fill="#1A1A1A">工具注册表</text>
  <text x="370" y="197" text-anchor="middle" font-size="10" fill="#6B7280">可替换</text>

  <rect x="526" y="152" width="128" height="56" rx="4" fill="#FFEE58" stroke="#1A1A1A"/>
  <text x="590" y="179" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A">Agent 主循环</text>
  <text x="590" y="197" text-anchor="middle" font-size="10" fill="#1A1A1A">也是插件</text>

  <rect x="746" y="152" width="128" height="56" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="810" y="179" text-anchor="middle" font-size="13" fill="#1A1A1A">会话日志</text>
  <text x="810" y="197" text-anchor="middle" font-size="10" fill="#6B7280">可替换</text>

  <!-- 下层插件（4 个） -->
  <rect x="86"  y="255" width="128" height="56" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="150" y="282" text-anchor="middle" font-size="13" fill="#1A1A1A">记忆</text>
  <text x="150" y="300" text-anchor="middle" font-size="10" fill="#6B7280">可替换</text>

  <rect x="306" y="255" width="128" height="56" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="370" y="282" text-anchor="middle" font-size="13" fill="#1A1A1A">UI</text>
  <text x="370" y="300" text-anchor="middle" font-size="10" fill="#6B7280">可替换</text>

  <rect x="526" y="255" width="128" height="56" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="590" y="282" text-anchor="middle" font-size="13" fill="#1A1A1A">调度</text>
  <text x="590" y="300" text-anchor="middle" font-size="10" fill="#6B7280">可替换</text>

  <rect x="746" y="255" width="128" height="56" rx="4" fill="#FFFFFF" stroke="#4D6BFE"/>
  <text x="810" y="282" text-anchor="middle" font-size="13" fill="#1A1A1A">Skill / 更多…</text>
  <text x="810" y="300" text-anchor="middle" font-size="10" fill="#6B7280">可替换</text>

  <!-- 插件树 → Cordis 底座 箭头 -->
  <line x1="460" y1="315" x2="460" y2="392" stroke="#4A4A4A" stroke-width="1.5"/>
  <polygon points="460,397 453,387 467,387" fill="#4A4A4A"/>

  <!-- 底座：Cordis -->
  <rect x="60" y="400" width="800" height="44" rx="4" fill="#F5F5F5" stroke="#1A1A1A"/>
  <text x="460" y="427" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A1A1A">Cordis 插件系统（TypeScript 元框架）</text>

  <!-- 荧光标注 -->
  <rect x="160" y="466" width="600" height="34" rx="3" fill="#FFEE58"/>
  <text x="460" y="489" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A">一切皆插件 · 无核心 · 无特权路径 · 连 Agent 主循环也是插件</text>

  <!-- 图例说明 -->
  <text x="460" y="534" text-anchor="middle" font-size="11" fill="#6B7280">（示意结构，非官方图 · 每块插件都能选、换、删、加）</text>
</svg>
